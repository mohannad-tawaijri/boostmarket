databases:
  - name: boost-db
    plan: free
    databaseName: boost_marketplace
    user: boost_user
    region: oregon

services:
  - type: web
    name: boost-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boost-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://boost-rosy-rho.vercel.app
