<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="lol-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#091428"/>
      <stop offset="50%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#0D1B30"/>
    </linearGradient>
    <linearGradient id="lol-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E6D2"/>
      <stop offset="50%" style="stop-color:#C8AA6E"/>
      <stop offset="100%" style="stop-color:#785A28"/>
    </linearGradient>
    <radialGradient id="lol-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C8AA6E;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#091428;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#lol-bg)"/>
  <circle cx="200" cy="150" r="120" fill="url(#lol-glow)"/>
  <!-- Decorative diamond pattern -->
  <g opacity="0.08" stroke="#C8AA6E" stroke-width="1" fill="none">
    <polygon points="200,30 370,150 200,270 30,150"/>
    <polygon points="200,60 340,150 200,240 60,150"/>
    <polygon points="200,90 310,150 200,210 90,150"/>
  </g>
  <!-- Crown/sword emblem -->
  <g transform="translate(200,135)" fill="url(#lol-gold)" opacity="0.9">
    <polygon points="0,-45 12,-20 40,-25 20,0 28,30 0,18 -28,30 -20,0 -40,-25 -12,-20"/>
    <rect x="-3" y="18" width="6" height="30" rx="2"/>
    <rect x="-18" y="45" width="36" height="6" rx="3"/>
  </g>
  <!-- Corner decorations -->
  <g stroke="#C8AA6E" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M20,20 L50,20 M20,20 L20,50"/>
    <path d="M380,20 L350,20 M380,20 L380,50"/>
    <path d="M20,280 L50,280 M20,280 L20,250"/>
    <path d="M380,280 L350,280 M380,280 L380,250"/>
  </g>
  <!-- Subtle lines -->
  <line x1="0" y1="150" x2="80" y2="150" stroke="#C8AA6E" stroke-width="0.5" opacity="0.2"/>
  <line x1="320" y1="150" x2="400" y2="150" stroke="#C8AA6E" stroke-width="0.5" opacity="0.2"/>
</svg>