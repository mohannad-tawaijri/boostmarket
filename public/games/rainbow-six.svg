<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="r6-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#0D0D1A"/>
    </linearGradient>
    <linearGradient id="r6-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#AAAACC"/>
    </linearGradient>
    <radialGradient id="r6-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#AAAACC;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#r6-bg)"/>
  <circle cx="200" cy="150" r="130" fill="url(#r6-glow)"/>
  <!-- Six-sided emblem -->
  <g transform="translate(200,145)" opacity="0.8">
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="none" stroke="url(#r6-white)" stroke-width="2.5"/>
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="#AAAACC" stroke-width="1" opacity="0.4"/>
    <!-- 6 inside -->
    <text x="0" y="8" text-anchor="middle" fill="url(#r6-white)" font-size="28" font-weight="bold" font-family="Arial" opacity="0.9">6</text>
  </g>
  <!-- Breach pattern -->
  <g opacity="0.05" stroke="#AAAACC" stroke-width="1">
    <line x1="50" y1="30" x2="120" y2="30"/>
    <line x1="50" y1="30" x2="50" y2="90"/>
    <line x1="280" y1="270" x2="350" y2="270"/>
    <line x1="350" y1="210" x2="350" y2="270"/>
  </g>
  <!-- Bullet holes -->
  <g fill="#AAAACC" opacity="0.08">
    <circle cx="100" cy="80" r="4"/>
    <circle cx="300" cy="90" r="3"/>
    <circle cx="80" cy="210" r="3.5"/>
    <circle cx="320" cy="220" r="3"/>
  </g>
</svg>