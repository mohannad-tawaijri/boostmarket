<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="dota-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#16162A"/>
    </linearGradient>
    <linearGradient id="dota-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E33B44"/>
      <stop offset="100%" style="stop-color:#A12B32"/>
    </linearGradient>
    <radialGradient id="dota-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E33B44;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#dota-bg)"/>
  <circle cx="200" cy="150" r="120" fill="url(#dota-glow)"/>
  <!-- Shield emblem -->
  <g transform="translate(200,140)" opacity="0.85">
    <path d="M0,-50 L35,-35 L40,10 L25,40 L0,55 L-25,40 L-40,10 L-35,-35 Z" fill="none" stroke="url(#dota-red)" stroke-width="3"/>
    <path d="M0,-38 L25,-26 L28,8 L18,30 L0,42 L-18,30 L-28,8 L-25,-26 Z" fill="url(#dota-red)" opacity="0.2"/>
    <!-- Inner design -->
    <line x1="0" y1="-30" x2="0" y2="35" stroke="#E33B44" stroke-width="2" opacity="0.6"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#E33B44" stroke-width="2" opacity="0.6"/>
    <circle r="6" fill="#E33B44" opacity="0.8"/>
  </g>
  <!-- Decorative elements -->
  <g opacity="0.06" stroke="#E33B44" stroke-width="1" fill="none">
    <circle cx="200" cy="150" r="80"/>
    <circle cx="200" cy="150" r="100"/>
    <path d="M100,50 L300,50 L350,150 L300,250 L100,250 L50,150 Z"/>
  </g>
  <!-- Flame particles -->
  <g fill="#E33B44" opacity="0.15">
    <circle cx="140" cy="70" r="3"/>
    <circle cx="260" cy="90" r="2"/>
    <circle cx="120" cy="220" r="2.5"/>
    <circle cx="280" cy="230" r="2"/>
    <circle cx="310" cy="100" r="1.5"/>
    <circle cx="90" cy="130" r="1.5"/>
  </g>
</svg>