<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2838"/>
      <stop offset="100%" style="stop-color:#171A21"/>
    </linearGradient>
    <linearGradient id="cs-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DE9B35"/>
      <stop offset="100%" style="stop-color:#B87A1E"/>
    </linearGradient>
    <radialGradient id="cs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DE9B35;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#1B2838;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#cs-bg)"/>
  <circle cx="200" cy="150" r="140" fill="url(#cs-glow)"/>
  <!-- Scope/crosshair -->
  <g transform="translate(200,145)" stroke="#DE9B35" fill="none" opacity="0.8">
    <circle r="40" stroke-width="2"/>
    <circle r="28" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-55" x2="0" y2="-42" stroke-width="2.5"/>
    <line x1="0" y1="42" x2="0" y2="55" stroke-width="2.5"/>
    <line x1="-55" y1="0" x2="-42" y2="0" stroke-width="2.5"/>
    <line x1="42" y1="0" x2="55" y2="0" stroke-width="2.5"/>
    <circle r="3" fill="#DE9B35"/>
  </g>
  <!-- Background pattern - hex grid -->
  <g opacity="0.04" stroke="#DE9B35" stroke-width="1" fill="none">
    <polygon points="60,30 90,15 120,30 120,60 90,75 60,60"/>
    <polygon points="120,30 150,15 180,30 180,60 150,75 120,60"/>
    <polygon points="220,30 250,15 280,30 280,60 250,75 220,60"/>
    <polygon points="280,30 310,15 340,30 340,60 310,75 280,60"/>
    <polygon points="60,230 90,215 120,230 120,260 90,275 60,260"/>
    <polygon points="280,230 310,215 340,230 340,260 310,275 280,260"/>
  </g>
  <!-- Diagonal accent lines -->
  <line x1="0" y1="300" x2="80" y2="260" stroke="#DE9B35" stroke-width="1" opacity="0.15"/>
  <line x1="400" y1="0" x2="320" y2="40" stroke="#DE9B35" stroke-width="1" opacity="0.15"/>
</svg>