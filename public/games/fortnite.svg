<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#0D0D1A"/>
    </linearGradient>
    <linearGradient id="fn-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#0078D4"/>
    </linearGradient>
    <radialGradient id="fn-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fn-bg)"/>
  <circle cx="200" cy="150" r="130" fill="url(#fn-glow)"/>
  <!-- Lightning bolt / F emblem -->
  <g transform="translate(200,140)" opacity="0.85">
    <path d="M-5,-50 L20,-50 L10,-10 L25,-10 L-8,55 L0,10 L-18,10 Z" fill="url(#fn-blue)"/>
  </g>
  <!-- Storm circle pattern -->
  <g opacity="0.06" stroke="#00D4FF" stroke-width="1" fill="none">
    <circle cx="200" cy="150" r="60"/>
    <circle cx="200" cy="150" r="90"/>
    <circle cx="200" cy="150" r="120"/>
  </g>
  <!-- Build grid pattern -->
  <g opacity="0.04" stroke="#00D4FF" stroke-width="1">
    <rect x="40" y="40" width="40" height="40"/>
    <rect x="320" y="40" width="40" height="40"/>
    <rect x="40" y="220" width="40" height="40"/>
    <rect x="320" y="220" width="40" height="40"/>
    <line x1="40" y1="40" x2="80" y2="80"/>
    <line x1="320" y1="220" x2="360" y2="260"/>
  </g>
  <!-- Sparkle accents -->
  <g fill="#00D4FF" opacity="0.15">
    <circle cx="120" cy="60" r="2"/>
    <circle cx="290" cy="80" r="2.5"/>
    <circle cx="80" cy="220" r="1.5"/>
    <circle cx="320" cy="200" r="2"/>
  </g>
</svg>