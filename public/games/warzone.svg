<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="wz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2A1A"/>
      <stop offset="100%" style="stop-color:#0D1A0D"/>
    </linearGradient>
    <linearGradient id="wz-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A"/>
      <stop offset="100%" style="stop-color:#558B2F"/>
    </linearGradient>
    <radialGradient id="wz-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8BC34A;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#1A2A1A;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#wz-bg)"/>
  <circle cx="200" cy="150" r="130" fill="url(#wz-glow)"/>
  <!-- Military crosshair/scope -->
  <g transform="translate(200,145)" opacity="0.8">
    <circle r="38" fill="none" stroke="url(#wz-green)" stroke-width="2"/>
    <circle r="25" fill="none" stroke="#8BC34A" stroke-width="1" opacity="0.4"/>
    <!-- Crosshair -->
    <line x1="0" y1="-50" x2="0" y2="-40" stroke="#8BC34A" stroke-width="2.5"/>
    <line x1="0" y1="40" x2="0" y2="50" stroke="#8BC34A" stroke-width="2.5"/>
    <line x1="-50" y1="0" x2="-40" y2="0" stroke="#8BC34A" stroke-width="2.5"/>
    <line x1="40" y1="0" x2="50" y2="0" stroke="#8BC34A" stroke-width="2.5"/>
    <!-- Chevron markers -->
    <path d="M-15,-15 L0,-8 L15,-15" fill="none" stroke="#8BC34A" stroke-width="1.5" opacity="0.6"/>
    <path d="M-15,15 L0,8 L15,15" fill="none" stroke="#8BC34A" stroke-width="1.5" opacity="0.6"/>
    <circle r="3" fill="#8BC34A" opacity="0.7"/>
  </g>
  <!-- Topo map lines -->
  <g opacity="0.05" stroke="#8BC34A" stroke-width="1" fill="none">
    <path d="M50,80 Q100,60 150,85 Q200,110 250,75 Q300,40 350,70"/>
    <path d="M50,100 Q100,80 150,105 Q200,130 250,95 Q300,60 350,90"/>
    <path d="M50,200 Q100,180 150,205 Q200,230 250,200 Q300,170 350,200"/>
    <path d="M50,220 Q100,200 150,225 Q200,250 250,220 Q300,190 350,220"/>
  </g>
</svg>