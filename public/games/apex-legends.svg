<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="apex-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E1E"/>
      <stop offset="100%" style="stop-color:#2A1A1A"/>
    </linearGradient>
    <linearGradient id="apex-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DA292A"/>
      <stop offset="100%" style="stop-color:#8B1A1A"/>
    </linearGradient>
    <radialGradient id="apex-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DA292A;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#1E1E1E;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#apex-bg)"/>
  <circle cx="200" cy="150" r="120" fill="url(#apex-glow)"/>
  <!-- Diamond/Apex emblem -->
  <g transform="translate(200,140)" opacity="0.85">
    <!-- Outer diamond -->
    <polygon points="0,-55 45,0 0,55 -45,0" fill="none" stroke="url(#apex-red)" stroke-width="3"/>
    <!-- Inner diamond -->
    <polygon points="0,-35 28,0 0,35 -28,0" fill="url(#apex-red)" opacity="0.2"/>
    <!-- A shape inside -->
    <path d="M0,-25 L15,15 L8,15 L4,5 L-4,5 L-8,15 L-15,15 Z" fill="#DA292A" opacity="0.9"/>
    <rect x="-6" y="0" width="12" height="3" fill="#1E1E1E" opacity="0.8"/>
  </g>
  <!-- Circuit/tech lines -->
  <g stroke="#DA292A" stroke-width="1" opacity="0.08">
    <path d="M0,50 L50,50 L70,80 L120,80"/>
    <path d="M400,250 L350,250 L330,220 L280,220"/>
    <path d="M0,200 L40,200 L60,180"/>
    <path d="M400,100 L360,100 L340,120"/>
  </g>
  <!-- Scatter dots -->
  <g fill="#DA292A" opacity="0.12">
    <circle cx="80" cy="60" r="2"/>
    <circle cx="320" cy="80" r="2.5"/>
    <circle cx="100" cy="240" r="1.5"/>
    <circle cx="300" cy="230" r="2"/>
    <circle cx="60" cy="150" r="1.5"/>
    <circle cx="340" cy="160" r="1.5"/>
  </g>
  <!-- Bottom accent -->
  <rect x="150" y="280" width="100" height="2" rx="1" fill="#DA292A" opacity="0.2"/>
</svg>